[tool.poetry]
name = "clinic-voice-worker"
version = "0.1.0"
description = "LiveKit Agents voice worker: bilingual (EN/HI) AI receptionist for Apollo Clinic Bengaluru"
authors = ["Abhisek Omkar Prasad <67184718+AbhisekOmkar@users.noreply.github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
livekit-agents = {version = "1.2.14", extras = ["deepgram", "openai", "cartesia", "silero", "turn-detector"]}
livekit = "^1.0.1"
livekit-api = "^1.0.1"
livekit-plugins-noise-cancellation = "^0.2.5"
loguru = "^0.7.3"
python-dotenv = "^1.0.1"
httpx = {extras = ["http2"], version = "^0.28.1"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^1.0.0"
black = "^24.1.0"
ruff = "^0.2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
lint.select = ["E", "W", "F", "I", "B", "C4"]
lint.ignore = ["E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
