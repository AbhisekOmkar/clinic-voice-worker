  name, pull context, and never re-ask who they are.
caller:
  phone: "+919810000006"
seed:
  appointments:
    - {patient_name: "Rakesh Gupta", phone: "+919810000006", practitioner_id: dr-rajendra-s, branch_id: br-indiranagar, date: "{next_monday}", start_hm: "17:00"}
turns:
  - user: "Hi, I'd like to see a skin specialist on {next_friday_speakable}, sometime in the morning."
